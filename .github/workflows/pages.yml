# Veröffentlicht die Dokumentation (Docsify) auf GitHub Pages.
# Die Navigation (_sidebar.md) wird hier erzeugt und nicht committet.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Navigation erzeugen
        run: bash scripts/docs-sidebar.sh
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _sidebar.md README.md LICENSE _site/
          touch _site/.nojekyll
          cp -R docs _site/docs
          mkdir -p _site/plugins/founder-journal
          cp -R plugins/founder-journal/skills _site/plugins/founder-journal/skills
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
